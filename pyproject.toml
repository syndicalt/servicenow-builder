[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jedi-devproject-0"
version = "0.2.0"
description = "FedRAMP-aligned AI-assisted ServiceNow Update Set candidate generator."
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.124",
  "pydantic>=2.12",
  "psycopg>=3.2",
  "uvicorn>=0.38",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]",
  "coverage",
  "mypy",
  "pip-audit",
  "pytest",
  "pytest-cov",
  "ruff",
  "types-defusedxml",
]

[project.scripts]
jedi-devproject = "jedi_devproject.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jedi_devproject = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["jedi_devproject"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.jedi-devproject.commands]
test = "python3 -m pytest --cov=jedi_devproject --cov-report=term-missing --cov-fail-under=90"
lint = "python3 -m ruff check src tests"
security = "python3 -m bandit -q -r src && python3 -m pip_audit . --progress-spinner off"
format = "python3 -m ruff format src tests"
typecheck = "python3 -m mypy src tests"
verify = "python3 -m ruff check src tests && python3 -m bandit -q -r src && python3 -m pip_audit . --progress-spinner off && python3 -m mypy src tests && python3 -m pytest --cov=jedi_devproject --cov-report=term-missing --cov-fail-under=90"
