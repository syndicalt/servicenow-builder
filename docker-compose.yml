services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jedi
      POSTGRES_USER: jedi
      POSTGRES_PASSWORD: jedi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jedi -d jedi"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: uvicorn jedi_devproject.runtime_api:build_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jedi:jedi@postgres:5432/jedi
      - SERVICENOW_INSTANCE_URL=${SERVICENOW_INSTANCE_URL}
      - SERVICENOW_CLIENT_ID=${SERVICENOW_CLIENT_ID}
      - SERVICENOW_CLIENT_SECRET=${SERVICENOW_CLIENT_SECRET}
      - JEDI_AUDIT_ROOT=/app/artifacts/audit
      - JEDI_WORKER_ID=jedi-devproject-api
      - JEDI_BUILD_CLAIM_APPLY=false
    volumes:
      - runtime-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m jedi_devproject.runtime_worker
    environment:
      - DATABASE_URL=postgresql://jedi:jedi@postgres:5432/jedi
      - SERVICENOW_INSTANCE_URL=${SERVICENOW_INSTANCE_URL}
      - SERVICENOW_CLIENT_ID=${SERVICENOW_CLIENT_ID}
      - SERVICENOW_CLIENT_SECRET=${SERVICENOW_CLIENT_SECRET}
      - JEDI_AUDIT_ROOT=/app/artifacts/audit
      - JEDI_WORKER_ID=jedi-devproject-worker
      - JEDI_BUILD_CLAIM_APPLY=false
    volumes:
      - runtime-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  runtime-artifacts:
